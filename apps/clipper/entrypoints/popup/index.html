<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio Clipper</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #FAFAF7;
        color: #1C1B19;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px 0;
        color: #2F6F5E;
      }
      p {
        font-size: 13px;
        color: #6B6860;
        margin: 0 0 16px 0;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        background: #2F6F5E;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
      <img src="/logo.png" alt="Folio" style="width: 24px; height: 24px; border-radius: 6px; object-fit: contain; box-shadow: 0 1px 2px rgba(0,0,0,0.06);" />
      <h1 style="margin: 0;">Folio Clipper</h1>
    </div>
    <p>Clip clean articles to read offline in Folio.</p>
    <button id="clip-btn">Clip to Folio</button>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
