# Mobile CI (audit EPUB-017): the JVM unit suite, a debug build and the Android
# lint gate run on every push/PR that touches the mobile module. JUnit XML and
# lint reports are uploaded as artifacts, so a red build explains itself
# without a local re-run.
name: mobile-ci

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + assembleDebug + lint
        working-directory: mobile
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-and-lint-reports
          path: |
            mobile/app/build/test-results/testDebugUnitTest/**
            mobile/app/build/reports/tests/testDebugUnitTest/**
            mobile/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
